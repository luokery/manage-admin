## -----------------------   spring datasource 配置   -----------------------
---
spring:
  datasource:
#    # 1. 连接池使用 druid
#    type: com.alibaba.druid.pool.DruidDataSource
#    # 2. 使用数据库平台(非必须)
#    platform: h2
#    # 3. url请修改为您的数据库连接
#    driver-class-name: org.h2.Driver
#    url: jdbc:h2:mem:managedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
#    username: sa
#    password: 
    # 1. 连接池使用 druid
    type: com.alibaba.druid.pool.DruidDataSource
    # 2. 使用数据库平台(非必须)
    platform: mysql
    # 3. url请修改为您的数据库连接
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://mysql.sqlpub.com:3306/manage_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root01
    password: 8fD0yZuRMSR3eegN
    druid:
      # 连接池配置
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      # 连接检测配置
      ## 配置间隔多久才进行一次检测, 检测需要关闭的空闲连接
      time-between-eviction-runs-millis: 60000
      ## 配置一个连接在池中最小生存的时间, 单位是毫秒
      min-evictable-idle-time-millis: 300000
      ## 配置一个连接在池中最大生存的时间, 单位是毫秒
      max-evictable-idle-time-millis: 900000
      ## 用来检测连接是否有效的sql
      validation-query: SELECT 1
      ## 申请连接的时候检测, 建议配置为true, 不影响性能, 并且保证安全性
      test-while-idle: true
      ## 获取连接时执行检测, 建议关闭, 影响性能
      test-on-borrow: false
      ##归还连接时执行检测, 建议关闭, 影响性能
      test-on-return: false
      # 合并多个DruidDataSource的监控数据 
      useGlobalDataSourceStat: false
      # 通过connectProperties属性来打开mergeSql功能；slowSqlMillis慢SQL记录: 500毫秒 
      # config.file配置文件; config.decrypt: 启用加密; config.decrypt.key: 配置公钥
      connectionProperties: "druid.stat.mergeSql=true;druid.stat.slowSqlMillis=500;config.decrypt=false;config.decrypt."
      # Druid StatViewServlet配置: 注意, 这里如果被其它过滤器拦截, 并修改了请求, 可能造成无法登陆druid后台
      stat-view-servlet:
        enabled: true
        reset-enable: true
        url-pattern: /druid/*
        login-username: admin
        login-password: admin123
        allow: '127.0.0.1,10.0.0.1'
        deny: '10.0.0.1,10.0.0.2'
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"
      #配置监控统计拦截的filters，stat:监控统计、log4j：日志记录、wall：防御sql注入，去掉后监控界面sql无法统计，'wall'用于防火墙
      #config是为了数据库加密
      filters: stat,wall,slf4j,log4j2,config
      # spring监控
      aop-patterns: com.example.manageadmin.mapper.*, com.example.manageadmin.service.*, com.example.manageadmin.controller.*
      # 过滤器配置: 日志输出
      filter:
        slf4j:
          enabled: false
          statement-create-after-log-enabled: false
          statement-close-after-log-enabled: false
          result-set-open-after-log-enabled: false
          result-set-close-after-log-enabled: false
        stat:
          enabled: true
          log-slow-sql: true
          merge-sql: true
          slow-sql-millis: 500
        wall:
          enabled: true
          config:
            drop-table-allow: false
            delete-allow: true
            multi-statement-allow: false
# h2控制台配置
#  h2:
#    console:
#      enabled: true
#      path: /h2
# 数据库初始化配置
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
#      schema-locations: classpath:db/schema_h2.sql
#      data-locations: classpath:db/data_h2.sql
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.manageadmin.model
  configuration:
    map-underscore-to-camel-case: true


