spring:
  profiles: 
    active: '@spring.profiles.active@'
  application:
    name: manageadmin
    version: 0.0.1-beta
    detail: this is demo web api project.
  banner:
    charset: UTF-8
    location: classpath:banner.txt
  # 优雅停机超时时间（默认30秒）
  lifecycle:
    timeout-per-shutdown-phase: 30s
  jackson:
    # spring-boot中对于@RestController或者@Controller+@ResponseBody注解的接口方法的返回值默认是Json格式，
    # 所以当对于date类型的数据，在返回浏览器端是会被spring-boot默认的Jackson框架转换
    date-format: yyyy-MM-dd HH:mm:ss
    # 而Jackson框架默认的时区GMT(相对于中国是少了8小时)
    time-zone: GMT+8
    #property-naming-strategy: SNAKE_CASE
#  main:
#    lazy-initialization: true
#    allow-bean-definition-overriding: true
server:
  # 优雅停机配置
  shutdown: graceful
  # 类似http://127.0.0.1这样的格式，这里仅做一个记录
  domain: http://localhost
  port: ${PORT:5000}
  servlet:
    # 项目基础URI
    context-path: /
  # 开启Http2，使其能够进行多路复用
  http2:
    enabled: true
        
# Log4j2 日志级别配置
logging:
  level:
    root: INFO
    com.example.manageadmin: DEBUG
    com.alibaba.druid: INFO
    org.springframework.cache: DEBUG
  config: classpath:log4j2.xml

# 文件上传配置
file:
  # 基础上传目录
  upload-dir: /tmp/uploads
  upload-url: /uploads
  ## 公开文件目录（可直接访问）
  public-dir: ${file.upload-dir}/public
  public-url: ${file.upload-url}/public
  ## 私密文件目录（需要认证）
  private-dir: ${file.upload-dir}/private
  private-url: ${file.upload-url}/private
  ### 项目图片目录
  project-dir: ${file.private-dir}/projects
  project-url: ${file.private-url}/projects

# Spring 文件上传配置
spring.servlet.multipart:
  enabled: true
  max-file-size: 10MB
  max-request-size: 20MB

# Spring Cache 配置 - 使用 Caffeine 本地缓存
spring.cache:
  type: caffeine
  cache-names: users, projects, statistics

# Caffeine 本地缓存配置
cache:
  caffeine:
    default-expire: 600
    max-size: 1000

# JWT 配置
jwt:
  secret: mySecretKeyForJwtTokenGenerationAndValidationMustBeAtLeast256BitsLong
  expiration: 86400000  # 24小时 (毫秒)
  header: Authorization
  prefix: "Bearer "

# Shiro 配置
shiro:
  enabled: true
  web:
    enabled: true
  loginUrl: /api/auth/login

