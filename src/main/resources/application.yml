spring:
  profiles: 
    active: '@spring.profiles.active@'
  application:
    name: manageadmin
    version: 0.0.1-beta
    detail: this is demo web api project.
  banner:
    charset: UTF-8
    location: classpath:banner.txt
  # 优雅停机超时时间（默认30秒）
  lifecycle:
    timeout-per-shutdown-phase: 30s
  jackson:
    # spring-boot中对于@RestController或者@Controller+@ResponseBody注解的接口方法的返回值默认是Json格式，
    # 所以当对于date类型的数据，在返回浏览器端是会被spring-boot默认的Jackson框架转换
    date-format: yyyy-MM-dd HH:mm:ss
    # 而Jackson框架默认的时区GMT(相对于中国是少了8小时)
    time-zone: GMT+8
    #property-naming-strategy: SNAKE_CASE
#  main:
#    lazy-initialization: true
#    allow-bean-definition-overriding: true
server:
  # 优雅停机配置
  shutdown: graceful
  # 类似http://127.0.0.1这样的格式，这里仅做一个记录
  domain: http://localhost
  port: ${PORT:5000}
  servlet:
    # 项目基础URI
    context-path: /
  # 开启Http2，使其能够进行多路复用
  http2:
    enabled: true

## -----------------------   spring datasource 配置   -----------------------
---
spring:
  datasource:
    # 1. 连接池使用 druid
    type: com.alibaba.druid.pool.DruidDataSource
    # 2. 使用数据库平台(非必须)
    platform: h2
    # 3. url请修改为您的数据库连接
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:managedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    druid:
      # 连接池配置
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      # 连接检测配置
      ## 配置间隔多久才进行一次检测, 检测需要关闭的空闲连接
      time-between-eviction-runs-millis: 60000
      ## 配置一个连接在池中最小生存的时间, 单位是毫秒
      min-evictable-idle-time-millis: 300000
      ## 配置一个连接在池中最大生存的时间, 单位是毫秒
      max-evictable-idle-time-millis: 900000
      ## 用来检测连接是否有效的sql
      validation-query: SELECT 1
      ## 申请连接的时候检测, 建议配置为true, 不影响性能, 并且保证安全性
      test-while-idle: true
      ## 获取连接时执行检测, 建议关闭, 影响性能
      test-on-borrow: false
      ##归还连接时执行检测, 建议关闭, 影响性能
      test-on-return: false
      # 合并多个DruidDataSource的监控数据 
      useGlobalDataSourceStat: false
      # 通过connectProperties属性来打开mergeSql功能；slowSqlMillis慢SQL记录: 500毫秒 
      # config.file配置文件; config.decrypt: 启用加密; config.decrypt.key: 配置公钥
      connectionProperties: "druid.stat.mergeSql=true;druid.stat.slowSqlMillis=500;config.decrypt=false;config.decrypt."
      # Druid StatViewServlet配置: 注意, 这里如果被其它过滤器拦截, 并修改了请求, 可能造成无法登陆druid后台
      stat-view-servlet:
        enabled: true
        reset-enable: true
        url-pattern: /druid/*
        login-username: admin
        login-password: admin123
        allow: '127.0.0.1,10.0.0.1'
        deny: '10.0.0.1,10.0.0.2'
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"
      #配置监控统计拦截的filters，stat:监控统计、log4j：日志记录、wall：防御sql注入，去掉后监控界面sql无法统计，'wall'用于防火墙
      #config是为了数据库加密
      filters: stat,wall,slf4j,log4j2,config
      # spring监控
      aop-patterns: com.example.manageadmin.mapper.*, com.example.manageadmin.service.*, com.example.manageadmin.controller.*
      # 过滤器配置: 日志输出
      filter:
        slf4j:
          enabled: false
          statement-create-after-log-enabled: false
          statement-close-after-log-enabled: false
          result-set-open-after-log-enabled: false
          result-set-close-after-log-enabled: false
        stat:
          enabled: true
          log-slow-sql: true
          merge-sql: true
          slow-sql-millis: 500
        wall:
          enabled: true
          config:
            drop-table-allow: false
            delete-allow: true
            multi-statement-allow: false
# h2控制台配置
#  h2:
#    console:
#      enabled: true
#      path: /h2
# 数据库初始化配置
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.manageadmin.model
  configuration:
    map-underscore-to-camel-case: true

# SpringDoc OpenAPI 配置
springdoc:
  version: '@springdoc.version@'
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  security-schemes:
    name: bearer-key
  group-configs:
    - group: "all service"
      displayName: 全部服务 API
      paths-to-match: "/**"
      packages-to-scan:
        - com.example.manageadmin.controller
    - group: 'Auth API'
      displayName: 认证管理 API
      paths-to-match: '/api/auth/**'
      packages-to-scan: com.example.manageadmin.controller
    - group: 'Cache API'
      displayName: 缓存管理 API
      paths-to-match: '/api/cache/**'
      packages-to-scan: com.example.manageadmin.controller
    - group: 'User API'
      displayName: 用户管理 API
      paths-to-match: '/api/users/**'
      packages-to-scan: com.example.manageadmin.controller
    - group: 'project API'
      displayName: 项目管理 API
      paths-to-match: '/api/projects/**'
      packages-to-scan: com.example.manageadmin.controller
  # 自定义OpenAPI文档信息
  openapi:
    info:
      title: "测试项目系统API1"  # 文档标题
      description: | # 文档描述
        基于 Spring Boot + MyBatis + MapStruct 的API文档示例 RESTful API 文档
        ## 认证说明
        - 大部分接口需要 JWT Token 认证
        - 请先调用 `/api/auth/login` 或 `/api/auth/register` 获取 Token 
        - 在 Swagger UI 中点击右上角 'Authorize' 按钮，输入 `Bearer <your_token>` 进行认证
      version: "1.0.0"  # 版本号
      contact:  # 联系人信息
        name: "开发团队"
        email: "dev@example.com"
      license: 
        name: MIT License
        url: https://choosealicense.com/licenses/mit/
    servers:  # 接口服务器地址(可选，默认使用当前服务地址)
      - url: "http://localhost:${server.port:8081}" # https://{domain}.localhost.com:{port}/api/{basePath}
        description: "开发环境"
      - url: https://bac27a6b-3c46-4dc1-a6c1-0f6dd5593bd0.dev.coze.site
        description: "生产环境"

        
# Log4j2 日志级别配置
logging:
  level:
    root: INFO
    com.example.manageadmin: DEBUG
    com.alibaba.druid: INFO
    org.springframework.cache: DEBUG
  config: classpath:log4j2.xml

# 文件上传配置
file:
  # 基础上传目录
  upload-dir: /tmp/uploads
  upload-url: /uploads
  ## 公开文件目录（可直接访问）
  public-dir: ${file.upload-dir}/public
  public-url: ${file.upload-url}/public
  ## 私密文件目录（需要认证）
  private-dir: ${file.upload-dir}/private
  private-url: ${file.upload-url}/private
  ### 项目图片目录
  project-dir: ${file.private-dir}/projects
  project-url: ${file.private-url}/projects

# Spring 文件上传配置
spring.servlet.multipart:
  enabled: true
  max-file-size: 10MB
  max-request-size: 20MB

